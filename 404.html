<!doctype html>
<html lang="en">
<head>

  <meta name="robots" content="noindex">

  <style>
    .not-found { min-height: 100vh; display: grid; place-items: center; padding: 32px 16px; text-align: center; }

</head>
<body>
  <main class="not-found">
    <div>
      <p class="code">404</p>
      <h1 class="section-title">This page doesn’t exist</h1>

      <a class="btn btn-primary" href="/">Back to the home page</a>
    </div>
